name: Monaco untouched-five continuation QA
on:
  push:
    branches: [monaco-launch-completion-126-20261021-e48b82]
    paths:
      - 'scripts/*monaco*continuation*'
      - 'scripts/pocket-monaco-protected-runner.mjs'
      - 'scripts/pocket-monaco-executor-bootstrap.mjs'
      - 'database/neon/20261024-first-six-continuation.sql'
      - 'tests/*monaco*continuation*'
      - 'tests/support/pocket-monaco-continuation-fixture.mjs'
      - '.github/actions/monaco-first-six-continuation/**'
      - '.github/workflows/monaco-continuation-qa.yml'
permissions:
  contents: read
jobs:
  continuation:
    if: github.repository == 'nashysaimarkets/nash-ai-markets' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install only isolated test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/monaco-continuation-qa" --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=15000 pg@8.16.3 typescript@5.9.3 @types/node@22.19.19 @supabase/supabase-js@2.110.2
          ln -s "$RUNNER_TEMP/monaco-continuation-qa/node_modules" node_modules
      - name: Run focused continuation and process-boundary checks
        shell: bash
        run: |
          test "$(node --version)" = v24.19.0
          for test_file in tests/pocket-monaco-continuation*.test.mjs; do
            if [[ "$test_file" == *-postgres.test.mjs ]]; then continue; fi
            node "$test_file"
          done
      - name: Verify scoped continuation against disposable PostgreSQL 17
        env:
          MONACO_QA_DISPOSABLE_POSTGRES: 'true'
        run: MONACO_QA_PG_MODULE="$RUNNER_TEMP/monaco-continuation-qa/node_modules/pg/lib/index.js" node tests/pocket-monaco-continuation-postgres.test.mjs
      - name: Confirm unchanged reviewed source
        run: |
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
# Synthetic localhost only; no protected environment, credentials or provider.
# No schedules, inference retries, deployment, cache or uploaded artifacts.
