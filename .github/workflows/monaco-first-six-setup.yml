name: Monaco protected credential authentication only
# Owner-protected check. No OpenAI request, ledger RPC, budget admission or deployment.
on:
  push:
    branches: [monaco-first-six-inference-126-20261021]
permissions:
  contents: read
concurrency:
  group: monaco-first-six-existing-five-dollar-allowance
  cancel-in-progress: false
env:
  REVIEWED_AUTH_SOURCE_SHA: 9f01b7e9b99295e046cf1d0e7dc4dbd2dd2c3b88
  REVIEWED_IDENTITY_SHA256: 32c788992c1909a8c704e35744f94ebb6df82fd121cff4878653a1d1da03dfc1
  REVIEWED_STORAGE_SHA256: 0d8800d8b052454e2ce1a5b72addb3c059c4b8895fb0757942f7bd6294d854c8
  NODE_OPTIONS: ''
  NODE_PATH: ''
jobs:
  authenticate-only:
    if: github.repository == 'nashysaimarkets/nash-ai-markets' && github.ref == 'refs/heads/monaco-first-six-inference-126-20261021' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: monaco-first-six-inference
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.REVIEWED_AUTH_SOURCE_SHA }}
          persist-credentials: false
          path: runner-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify source and install committed isolated dependencies
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C runner-source rev-parse HEAD)" = "$REVIEWED_AUTH_SOURCE_SHA"
          test "$(node --version)" = v24.19.0
          printf 'CHECKED_OUT_SOURCE_SHA=%s\n' "$(git -C runner-source rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/monaco-first-six-runtime"
          cp runner-source/tools/monaco-first-six-runtime/package.json runner-source/tools/monaco-first-six-runtime/package-lock.json "$RUNNER_TEMP/monaco-first-six-runtime/"
          npm ci --prefix "$RUNNER_TEMP/monaco-first-six-runtime" --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=15000
          git -C runner-source diff --exit-code HEAD
          test -z "$(git -C runner-source status --porcelain)"
      - name: Authenticate stored ledger password and fingerprint stored inference key
        shell: bash
        run: node runner-source/scripts/pocket-monaco-credential-auth.mjs
        env:
          MONACO_FIRST_SIX_OPENAI_API_KEY: ${{ secrets.MONACO_FIRST_SIX_OPENAI_API_KEY }}
          MONACO_FIRST_SIX_LEDGER_KEY: ${{ secrets.MONACO_FIRST_SIX_LEDGER_KEY }}
# No artifact upload, inference action, provider SDK instantiation, retries or schedule.
