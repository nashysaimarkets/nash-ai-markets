name: Monaco protected first-six one-shot
# One-shot execution wrapper: exact credential binding and original allowance
# were admitted after protected authentication and independent review.
# Source, evidence and wrapper commits are separate; never rerun this job.
on:
  push:
    branches: [monaco-first-six-inference-126-20261021]
permissions:
  contents: read
concurrency:
  group: monaco-first-six-existing-five-dollar-allowance
  cancel-in-progress: false
env:
  REVIEWED_SETUP_SOURCE_SHA: 9e82c6d25dcb7f589e2328b2efc7910033d8fcdc
  REVIEWED_SETUP_EVIDENCE_SHA: 4ebb6a4023d7a01ca5188d54f592264acf48644b
  NODE_OPTIONS: ''
  NODE_PATH: ''
jobs:
  first-six:
    if: github.repository == 'nashysaimarkets/nash-ai-markets' && github.ref == 'refs/heads/monaco-first-six-inference-126-20261021' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: monaco-first-six-inference
    steps:
      - name: Require immutable reviewed pins
        shell: bash
        run: |
          [[ "$REVIEWED_SETUP_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'HOLD: reviewed source is unbound'; exit 1; }
          [[ "$REVIEWED_SETUP_EVIDENCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'HOLD: reviewed evidence is unbound'; exit 1; }
          test "$GITHUB_RUN_ATTEMPT" = 1
      - id: source_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.REVIEWED_SETUP_SOURCE_SHA }}
          persist-credentials: false
          path: runner-source
      - id: evidence_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.REVIEWED_SETUP_EVIDENCE_SHA }}
          persist-credentials: false
          path: runner-evidence
          sparse-checkout: |
            docs/monaco-126/isolated-runner
            qa/launch-account-controls
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify actual checkouts and preserve the exact Node binary
        shell: bash
        run: |
          test "$(git -C runner-source rev-parse HEAD)" = "$REVIEWED_SETUP_SOURCE_SHA"
          test "$(git -C runner-evidence rev-parse HEAD)" = "$REVIEWED_SETUP_EVIDENCE_SHA"
          test "$(node --version)" = v24.19.0
          printf 'CHECKED_OUT_SOURCE_SHA=%s\n' "$(git -C runner-source rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'CHECKED_OUT_EVIDENCE_SHA=%s\n' "$(git -C runner-evidence rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'MONACO_PINNED_NODE_EXECUTABLE=%s\n' "$(node -p process.execPath)" >> "$GITHUB_ENV"
      - name: Install the committed isolated runtime without install scripts
        working-directory: runner-source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/monaco-first-six-runtime"
          cp tools/monaco-first-six-runtime/package.json tools/monaco-first-six-runtime/package-lock.json "$RUNNER_TEMP/monaco-first-six-runtime/"
          npm ci --prefix "$RUNNER_TEMP/monaco-first-six-runtime" --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=15000
      - name: Verify source unchanged before any credentialed operation
        shell: bash
        run: |
          git -C runner-source diff --exit-code HEAD
          test -z "$(git -C runner-source status --porcelain)"
          git -C runner-evidence diff --exit-code HEAD
          test -z "$(git -C runner-evidence status --porcelain)"
      - name: Execute the protected one-shot JavaScript action
        uses: ./runner-source/.github/actions/monaco-first-six
        env:
          MONACO_FIRST_SIX_OPENAI_API_KEY: ${{ secrets.MONACO_FIRST_SIX_OPENAI_API_KEY }}
          MONACO_FIRST_SIX_LEDGER_KEY: ${{ secrets.MONACO_FIRST_SIX_LEDGER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Confirm source trees remain unchanged
        if: always() && steps.source_checkout.outcome == 'success' && steps.evidence_checkout.outcome == 'success'
        shell: bash
        run: |
          git -C runner-source diff --exit-code HEAD
          test -z "$(git -C runner-source status --porcelain)"
          git -C runner-evidence diff --exit-code HEAD
          test -z "$(git -C runner-evidence status --porcelain)"
# No schedule, dispatch inputs, plaintext uploads or provider retry/failover.
# GitHub supplies scoped artifact credentials to the local JavaScript action.
# Public handoff key: one-day immutable artifact. Encrypted results: seven days.
# Artifact SDK storage retries never cause an inference resend.
# Preserve private decrypted results before ciphertext artifact expiry.
