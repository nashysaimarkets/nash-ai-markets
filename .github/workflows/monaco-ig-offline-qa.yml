name: Monaco IG DEMO offline QA
on:
  push:
    branches: [monaco-ig-126-20261019]
permissions:
  contents: read
concurrency:
  group: monaco-ig-offline
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTP_IG_DEMO_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Offline transport, lifecycle and browser isolation
        run: node --test tests/ntp-ig-demo*.test.ts
      - name: Actual panel renders
        run: node --import tsx --test tests/render/ig-demo-panel.test.ts
      - name: Strict changed-source type check
        run: npx tsc --noEmit --strict --skipLibCheck --allowImportingTsExtensions --moduleResolution bundler --module esnext --target es2022 --jsx react-jsx app/lib/server/ntp-ig-demo-read-only.ts app/lib/server/ntp-ig-demo-response-contract.ts app/lib/server/ntp-ig-demo-connection.ts app/lib/ig-demo-panel.ts app/components/IgDemoPositionPanel.tsx
      - run: npm run security:scan
      - name: No provider acceptance claim
        run: echo 'All transports are mocked. IG feature OFF; real account, rights and deployment gates remain BLOCKED.'
