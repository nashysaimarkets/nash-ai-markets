name: Monaco protected runner compatibility QA
on:
  push:
    branches: [monaco-launch-completion-126-20261021-e48b82]
    paths:
      - 'scripts/pocket-monaco-protected-runner.mjs'
      - 'tests/pocket-monaco-protected-runner.test.mjs'
      - '.github/workflows/monaco-runner-compat-qa.yml'
permissions:
  contents: read
jobs:
  affected-runner:
    if: github.repository == 'nashysaimarkets/nash-ai-markets' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Run only affected offline runner checks
        run: node tests/pocket-monaco-protected-runner.test.mjs
