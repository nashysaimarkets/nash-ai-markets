name: Pocket scanner geometry repair affected acceptance

on:
  push:
    branches: [monaco-scanner-geometry-repair-126-20261024]
    paths:
      - 'app/api/pocket/analysis-calibration.ts'
      - 'app/api/pocket/liquidity-chain.ts'
      - 'tests/**'
      - 'scripts/verify-pocket-scanner-geometry-repair.mjs'
      - '.github/workflows/pocket-scanner-geometry-repair-qa.yml'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: pocket-scanner-geometry-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geometry-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      GIT_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
      POCKET_BENCHMARK_PILOT_ENABLED: 'false'
      POCKET_REAL_BENCHMARK_DISPATCH: 'false'
      POCKET_BENCHMARK_RUNTIME_METADATA_ENABLED: 'false'
      POCKET_SCANNER_GEOMETRY_QA_OUTPUT: qa/scanner-geometry-repair-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Confirm exact source and disabled automatic deployment
        run: |
          test "$(git rev-parse HEAD)" = "$GIT_COMMIT_SHA"
          node -e "const c=require('./vercel.json'); if(c.git.deploymentEnabled['monaco-scanner-geometry-repair-126-20261024']!==false)process.exit(1)"
      - name: Install unchanged locked dependencies
        run: npm ci --no-audit --no-fund --fetch-retries=0
      - name: Verify affected calibration and original-coordinate regressions
        run: node scripts/verify-pocket-scanner-geometry-repair.mjs
      - name: Check affected source integration
        run: |
          npm run typecheck
          npx eslint app/api/pocket/analysis-calibration.ts app/api/pocket/liquidity-chain.ts
          npm run security:scan
          git diff --check
      - name: Retain exact-source acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-scanner-geometry-repair-${{ github.sha }}
          path: ${{ env.POCKET_SCANNER_GEOMETRY_QA_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
