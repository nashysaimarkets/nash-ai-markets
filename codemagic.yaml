workflows:
  pocket-bullseye-ios-review:
    name: Pocket Bullseye — submit approved 1.2.7 build 23
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Pocket Bullseye App Store
    environment:
      xcode: latest
      vars:
        # This signed package has already been accepted by Apple. Reuse it.
        APP_STORE_CONNECT_SKIP_PACKAGE_UPLOAD: "true"
    scripts:
      - name: Retrieve the signed and uploaded build 23
        script: |
          set -euo pipefail
          mkdir -p review-artifacts
          curl --fail --location --retry 2 --output review-artifacts/App.ipa \
            'https://api.codemagic.io/artifacts/86487b1c-e3b4-4168-80a9-0f3653f1e55b/0873c6df-c470-444b-97c1-6fd9ce4f168f/App.ipa'
          python3 scripts/verify-ios-review-artifact.py review-artifacts/App.ipa
    artifacts:
      - review-artifacts/App.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
