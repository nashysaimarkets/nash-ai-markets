workflows:
  pocket-bullseye-ios-testflight: &pocket_ios_release
    name: Pocket Bullseye — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Pocket Bullseye App Store
    environment:
      node: 22.13.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nashaimarkets.pocketbullseye
    triggering:
      events:
        - tag
        - push
      tag_patterns:
        - pattern: "ios-v*"
          include: true
      branch_patterns:
        - pattern: "release/pocket-ios-*"
          include: true
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Run Pocket Bullseye release checks
        script: |
          npm run typecheck
          npm run test:unit
          npm run security:scan
      - name: Verify native subscription state policy
        script: |
          swiftc ios/App/App/PocketPurchaseState.swift scripts/tests/PocketPurchaseStateTests.swift -o /tmp/pocket-purchase-state-tests
          /tmp/pocket-purchase-state-tests
          swiftc ios/App/App/PocketStoreDiagnostics.swift scripts/tests/PocketStoreDiagnosticsTests.swift -o /tmp/pocket-store-diagnostic-tests
          /tmp/pocket-store-diagnostic-tests
      - name: Build verified Pocket Bullseye web bundle
        script: |
          npm run build
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
          test -f ios/NativeWeb/index.html
      - name: Synchronise verified bundle into Capacitor iOS
        script: |
          eval "$(node scripts/load-release-pin.mjs)"
          node scripts/verify-capacitor-server.mjs
          npx cap sync ios
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed App Store archive
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        # Preserve Apple's review queue; see docs/app-store/RELEASE_POLICY.md.
        cancel_previous_submissions: false
        release_type: AFTER_APPROVAL

  pocket-bullseye-ios-stage-next:
    <<: *pocket_ios_release
    name: Pocket Bullseye — Stage next iPhone release
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "stage/pocket-ios-*"
          include: true
    publishing:
      app_store_connect:
        auth: integration
        # Upload the next binary without disturbing a version already in review.
        submit_to_app_store: false

  pocket-apple-release-status:
    name: Pocket Bullseye — Apple release status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Pocket Bullseye App Store
    scripts:
      - name: Read current Apple versions and latest build
        script: python3 scripts/read-apple-release-status.py

  pocket-apple-subscription-status:
    name: Pocket Bullseye — Read Apple subscription setup
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Pocket Bullseye App Store
    scripts:
      - name: Read subscription approval availability and UK price
        script: python3 scripts/read-apple-subscription-status.py

  pocket-apple-submit-staged:
    name: Pocket Bullseye — Submit staged iPhone release
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Pocket Bullseye App Store
    scripts:
      - name: Verify review-preservation guard
        script: python3 -m unittest discover -s scripts/tests -p 'test_submit_staged_iphone.py'
      - name: Submit verified candidate after the preceding release completes
        script: python3 scripts/submit-staged-iphone.py --submit

  pocket-apple-prepare-draft:
    name: Pocket Bullseye — Prepare existing Apple draft
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Pocket Bullseye App Store
    scripts:
      - name: Verify review-preservation guard
        script: python3 -m unittest discover -s scripts/tests -p 'test_submit_staged_iphone.py'
      - name: Attach verified build and release notes without submitting
        script: python3 scripts/prepare-apple-release-draft.py

  pocket-apple-listing-refresh:
    name: Pocket Bullseye — Refresh listing without a new build
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Pocket Bullseye App Store
    scripts:
      - name: Audit screenshots and update editable listing copy
        script: python3 scripts/update-apple-listing-copy.py
