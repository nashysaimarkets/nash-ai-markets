workflows:
  pocket-bullseye-ios-review:
    name: Pocket Bullseye — submit approved 1.2.7 build 23
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Pocket Bullseye App Store
    environment:
      xcode: latest
    scripts:
      - name: Submit Apple's existing version 1.2.7 build 23 for review
        script: |
          set -euo pipefail
          python3 -c 'import json; from pathlib import Path; notes = json.loads(Path("release_notes.json").read_text()); Path("/tmp/pocket-whats-new.txt").write_text(next(item["text"] for item in notes if item["language"] == "en-GB"))'
          # Apple build resource ID confirmed in the successful upload job's
          # App Store Connect post-processing log. This submits that existing
          # binary without downloading, rebuilding, or re-uploading it.
          # Replacing pending submissions and automatic release were explicitly
          # approved by the owner on 7 September 2026.
          app-store-connect builds submit-to-app-store \
            bd3b3e73-cfb4-4641-8f26-56089fec7744 \
            --version-string 1.2.7 \
            --platform IOS \
            --locale en-GB \
            --whats-new @file:/tmp/pocket-whats-new.txt \
            --cancel-previous-submissions \
            --release-type AFTER_APPROVAL \
            --max-build-processing-wait 5
