  <defs>
    <linearGradient id="gold" x1=".12" y1=".08" x2=".88" y2=".92">
      <stop stop-color="#FFF0A8"/><stop offset=".23" stop-color="#D4AF37"/><stop offset=".5" stop-color="#8A5B13"/><stop offset=".72" stop-color="#F0C95A"/><stop offset="1" stop-color="#8B5A10"/>
