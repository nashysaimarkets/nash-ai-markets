  <text x="300" y="405" fill="url(#g)" font-family="Poppins,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="14" text-anchor="middle">NASH <tspan fill="url(#e)">AI</tspan></text>
  <text x="300" y="454" fill="#F8F9FA" font-family="Poppins,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="22" text-anchor="middle">MARKETS</text>
