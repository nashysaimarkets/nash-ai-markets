<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
  <title id="title">NASH AI Markets primary logo</title>
  <desc id="desc">Primary stacked logo with gold bullseye, emerald arrow and AI-powered market intelligence tagline.</desc>
  <defs>
    <linearGradient id="g" x1=".12" y1=".08" x2=".88" y2=".92"><stop stop-color="#FFF0A8"/><stop offset=".23" stop-color="#D4AF37"/><stop offset=".5" stop-color="#82510E"/><stop offset=".72" stop-color="#F0C95A"/><stop offset="1" stop-color="#8B5A10"/></linearGradient>
    <linearGradient id="e" x1=".1" y1=".9" x2=".9" y2=".1"><stop stop-color="#06472F"/><stop offset=".48" stop-color="#0F8F5F"/><stop offset="1" stop-color="#42D79A"/></linearGradient>
    <radialGradient id="a"><stop stop-color="#0F8F5F" stop-opacity=".28"/><stop offset="1" stop-color="#07100D" stop-opacity="0"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#000" flood-opacity=".75"/></filter>
